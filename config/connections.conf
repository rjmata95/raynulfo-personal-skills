# dbq shared connection registry
#
# TRACKED IN GIT. Contains NO hostnames and NO credentials — only the fact that an
# alias exists and what kind of thing it is. Hosts and secrets live in:
#   ~/.config/dbq/env       (mongo URIs)
#   ~/.config/dbq/my.cnf    (mysql option groups)
#
# Personal additions and overrides go in ~/.config/dbq/connections.local.conf,
# which is loaded AFTER this file and overrides by alias name. Add your own
# connections with `dbq init --add` rather than editing this file — that keeps
# this registry shareable when the skill is promoted to other teams.
#
# Format (pipe-delimited, no spaces around pipes):
#   alias|kind|env|mode|default_db|description
#
#   alias       short name used as `dbq <alias> '<query>'`. [a-z0-9-] only.
#   kind        mongo | mysql
#   env         prod | nonprod | qa | local   (advisory; shown in --list and prompts)
#   mode        ro | rw                       (ro rejects mutating queries pre-flight)
#   default_db  database used when the query does not name one. "-" for none.
#   description free text, shown in --list

medication|mongo|prod|ro|medication|Medication domain — prescriptions, med orders, DDI/DAI
patient|mongo|prod|ro|patient|Patient domain — demographics, pharmacies, allergies
encounter|mongo|prod|ro|encounter|Encounter domain — visits, notes
practice-mgmt|mongo|prod|ro|practice-mgmt|Practice management — offices, providers
tenant-mgmt|mongo|prod|ro|tenant-mgmt|Tenant management — tenants, markets, config
medication-nonprod|mongo|nonprod|ro|medication|Medication domain, NONPROD — safe for experiments
mysql-prod|mysql|prod|ro|DASHBOARD_PROD|BIDW prod — dashboard/reporting warehouse
mysql-qa|mysql|qa|ro|DASHBOARD_PROD|DASH QA — dashboard schema, QA data
