# dbq shared connection registry
#
# TRACKED IN GIT. Contains NO hostnames and NO credentials — only the fact that an
# alias exists and what kind of thing it is. Hosts and secrets live in:
#   ~/.config/dbq/env       (mongo URIs)
#   ~/.config/dbq/my.cnf    (mysql option groups)
#
# Personal additions and overrides go in ~/.config/dbq/connections.local.conf,
# which is loaded AFTER this file and overrides by alias name. Add your own
# connections with `dbq init --add` rather than editing this file — that keeps
# this registry shareable when the skill is promoted to other teams.
#
# Format (pipe-delimited, no spaces around pipes):
#   alias|kind|env|mode|default_db|description
#
#   alias       short name used as `dbq <alias> '<query>'`. [a-z0-9-] only.
#   kind        mongo | mysql
#   env         prod | nonprod | qa | local   (advisory; shown in --list and prompts)
#   mode        ro | rw                       (ro rejects mutating queries pre-flight)
#   default_db  database used when the query does not name one. "-" for none.
#   description free text, shown in --list
#
# ---------------------------------------------------------------------------
# IMPORTANT: the Mongo aliases below are CLUSTERS, not databases.
#
# Each cluster hosts many per-service databases following the platform's CQRS
# split — e.g. the medication cluster holds patient-prescription-cmd,
# patient-prescription-query, pharmacy-cmd, pharmacy-query, medication-query,
# and ~20 more. There is no single database named "medication".
#
# So default_db is deliberately "-" for every Mongo cluster: guessing one would
# silently point queries at a database that does not exist and return empty
# results that look like real answers. Name the database explicitly:
#
#   DBQ_DB=patient-prescription-query dbq medication 'db.<coll>.findOne()'
#   dbq medication 'db.getSiblingDB("pharmacy-query").<coll>.findOne()'
#
# `dbq --collections <alias>` lists databases when no default_db is set.
# See knowledge/<alias>/_schema.md for which database holds what.
# ---------------------------------------------------------------------------

medication|mongo|prod|ro|-|Medication cluster — prescriptions, med orders, pharmacies, allergies, DDI/DAI
patient|mongo|prod|ro|-|Patient cluster — demographics, preferences, badges, eligibility, documents
encounter|mongo|prod|ro|-|Encounter cluster — encounter types, screening
practice-mgmt|mongo|prod|ro|-|Practice management cluster — appointments, providers, schedules, offices
tenant-mgmt|mongo|prod|ro|-|Tenant management cluster — tenants, roles, users, permissions
medication-nonprod|mongo|nonprod|ro|-|Medication cluster, NONPROD — safe for experiments
mysql-prod|mysql|prod|ro|DASHBOARD_PROD|BIDW prod — dashboard/reporting warehouse
mysql-qa|mysql|qa|ro|DASHBOARD_PROD|DASH QA — dashboard schema, QA data
